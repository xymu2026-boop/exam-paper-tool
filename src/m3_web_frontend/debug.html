<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#111827" />
  <title>试卷宝 · 调试面板</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box }
    body { background:#111827; color:#e5e7eb; font-family:system-ui,-apple-system,sans-serif; min-height:100vh }
    .container { max-width:1400px; margin:0 auto; padding:16px }
    h1 { font-size:20px; margin-bottom:16px; display:flex; align-items:center; gap:8px }
    h1 span { font-size:14px; color:#9ca3af; font-weight:400 }

    .dropzone {
      border:2px dashed #374151; border-radius:12px; padding:40px 20px;
      text-align:center; cursor:pointer; transition:all .2s;
      margin-bottom:20px; background:#1f2937
    }
    .dropzone:hover, .dropzone.dragover { border-color:#3b82f6; background:#1e3a5f }
    .dropzone p { font-size:15px; color:#9ca3af }
    .dropzone .icon { font-size:40px; margin-bottom:8px }
    .dropzone input { display:none }

    .status-bar {
      display:flex; align-items:center; gap:12px; padding:12px 16px;
      background:#1f2937; border-radius:8px; margin-bottom:20px;
      font-size:14px
    }
    .status-bar .score { font-weight:700; font-size:24px }
    .status-bar .score.good { color:#34d399 }
    .status-bar .score.warn { color:#fbbf24 }
    .status-bar .meta { color:#9ca3af; font-size:13px }
    .spinner { display:inline-block; width:18px; height:18px; border:2px solid #374151; border-top-color:#3b82f6; border-radius:50%; animation:spin .8s linear infinite }
    @keyframes spin { to { transform:rotate(360deg) } }

    .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px }
    @media (max-width:900px) { .grid { grid-template-columns:repeat(2,1fr) } }
    @media (max-width:500px) { .grid { grid-template-columns:1fr } }

    .card { background:#1f2937; border-radius:10px; overflow:hidden }
    .card__header { padding:10px 14px; border-bottom:1px solid #374151; display:flex; justify-content:space-between; align-items:center }
    .card__title { font-size:14px; font-weight:600 }
    .card__badge { font-size:11px; padding:2px 8px; border-radius:10px; background:#374151; color:#9ca3af }
    .card__image { width:100%; display:block; min-height:200px; background:#111827; object-fit:contain }
    .card__image[src=""] { display:none }
    .card__placeholder { display:flex; align-items:center; justify-content:center; min-height:200px; color:#4b5563; font-size:13px }

    .warnings { padding:12px 16px; background:#78350f; border-radius:8px; margin-bottom:20px; font-size:13px; color:#fbbf24 }
    .warnings:empty { display:none }

    .btn { padding:8px 20px; border-radius:8px; border:none; cursor:pointer; font-size:13px; transition:all .15s }
    .btn--secondary { background:#374151; color:#e5e7eb }
    .btn--secondary:hover { background:#4b5563 }
    .btn--danger { background:#7f1d1d; color:#fca5a5 }
    .toolbar { display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:8px }
  </style>
</head>
<body>
  <div class="container">
    <div class="toolbar">
      <h1>试卷宝 调试面板 <span>拖图→实时处理→6图同屏</span></h1>
      <button class="btn btn--danger" onclick="cleanup()">🧹 清理调试文件</button>
    </div>

    <div class="dropzone" id="dropzone" onclick="document.getElementById('fileInput').click()">
      <div class="icon">📸</div>
      <p>拖拽试卷照片到这里，或点击选择</p>
      <p style="font-size:12px;margin-top:4px;color:#6b7280">支持 JPG / PNG / HEIC，处理约 5-15 秒</p>
      <input type="file" id="fileInput" accept="image/*" onchange="handleFile(this.files[0])" />
    </div>

    <div class="status-bar hidden" id="statusBar">
      <div class="spinner hidden" id="spinner"></div>
      <div>
        <div id="statusText">准备就绪</div>
        <div class="meta" id="statusMeta"></div>
      </div>
      <div style="margin-left:auto" class="score hidden" id="scoreBadge"></div>
    </div>

    <div class="warnings hidden" id="warnings"></div>

    <div class="grid" id="grid"></div>
  </div>

  <script>
    const STAGES = [
      { key:'original',        title:'① 原图',        badge:'原始照片' },
      { key:'processed',       title:'② 预处理',      badge:'旋转/裁边/去阴影' },
      { key:'red_mask',        title:'③ 红笔 Mask',   badge:'LAB a* 通道' },
      { key:'handwriting_mask',title:'④ 手写 Mask',   badge:'灰度+形态学' },
      { key:'combined_mask',   title:'⑤ 合并 Mask',   badge:'红笔 ∪ 手写' },
      { key:'cleaned',         title:'⑥ 最终清理',    badge:'bgfill+inpaint' },
    ]

    const grid = document.getElementById('grid')
    const dropzone = document.getElementById('dropzone')
    const statusBar = document.getElementById('statusBar')
    const spinner = document.getElementById('spinner')
    const statusText = document.getElementById('statusText')
    const statusMeta = document.getElementById('statusMeta')
    const scoreBadge = document.getElementById('scoreBadge')
    const warningsEl = document.getElementById('warnings')

    // Build grid cards
    STAGES.forEach(s => {
      const card = document.createElement('div')
      card.className = 'card'
      card.id = `card-${s.key}`
      card.innerHTML = `
        <div class="card__header">
          <span class="card__title">${s.title}</span>
          <span class="card__badge">${s.badge}</span>
        </div>
        <div class="card__placeholder" id="ph-${s.key}">等待处理…</div>
        <img class="card__image hidden" id="img-${s.key}" alt="${s.title}" />
      `
      grid.appendChild(card)
    })

    // Drag & drop
    dropzone.addEventListener('dragover', e => { e.preventDefault(); dropzone.classList.add('dragover') })
    dropzone.addEventListener('dragleave', () => dropzone.classList.remove('dragover'))
    dropzone.addEventListener('drop', e => {
      e.preventDefault(); dropzone.classList.remove('dragover')
      const f = e.dataTransfer.files[0]
      if (f) handleFile(f)
    })

    async function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) { alert('请选择图片文件'); return }

      statusBar.classList.remove('hidden')
      spinner.classList.remove('hidden')
      scoreBadge.classList.add('hidden')
      warningsEl.classList.add('hidden')
      warningsEl.textContent = ''
      statusText.textContent = '上传并处理中…'
      statusMeta.textContent = file.name

      const fd = new FormData()
      fd.append('file', file)

      try {
        const res = await fetch('/api/debug/process', { method:'POST', body:fd })
        const data = await res.json()

        if (!res.ok) {
          statusText.textContent = '处理失败'
          statusMeta.textContent = data.error || '未知错误'
          spinner.classList.add('hidden')
          if (data.warnings) showWarnings(data.warnings)
          return
        }

        spinner.classList.add('hidden')
        statusText.textContent = `处理完成 · ${data.session_id}`
        statusMeta.textContent = ''

        const score = data.quality_score
        scoreBadge.classList.remove('hidden')
        scoreBadge.textContent = score.toFixed(2)
        scoreBadge.className = `score ${score >= 0.6 ? 'good' : 'warn'}`

        if (data.warnings && data.warnings.length) showWarnings(data.warnings)

        // Update all 6 images
        STAGES.forEach(s => {
          const url = data.stages[s.key]
          const img = document.getElementById(`img-${s.key}`)
          const ph = document.getElementById(`ph-${s.key}`)
          if (url) {
            img.src = url + '?t=' + Date.now()
            img.classList.remove('hidden')
            ph.style.display = 'none'
          } else {
            img.classList.add('hidden')
            ph.style.display = 'flex'
            ph.textContent = '未生成'
          }
        })
      } catch (e) {
        statusText.textContent = '请求失败'
        statusMeta.textContent = e.message
        spinner.classList.add('hidden')
      }
    }

    function showWarnings(ws) {
      warningsEl.classList.remove('hidden')
      warningsEl.innerHTML = '<strong>⚠ Warnings:</strong><br>' + ws.map(w => `· ${w}`).join('<br>')
    }

    async function cleanup() {
      try {
        await fetch('/api/debug/cleanup', { method:'POST' })
        alert('调试文件已清理')
        STAGES.forEach(s => {
          document.getElementById(`img-${s.key}`).classList.add('hidden')
          document.getElementById(`img-${s.key}`).src = ''
          document.getElementById(`ph-${s.key}`).style.display = 'flex'
          document.getElementById(`ph-${s.key}`).textContent = '等待处理…'
        })
      } catch(e) { alert('清理失败: ' + e.message) }
    }
  </script>
</body>
</html>
