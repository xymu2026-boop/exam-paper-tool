<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3B82F6" />
  <title>试卷宝 · 试卷详情</title>
  <link rel="stylesheet" href="static/style.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.7/dist/cdn.min.js"></script>

  <script src="static/api.js"></script>
  <script src="static/app.js"></script>
  <script src="static/crop.js"></script>

  <style>
    /* ── Stage tabs ── */
    .stage-tabs {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-bottom: var(--space-2);
    }
    .stage-tab {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--bg-card);
      color: var(--text-secondary);
      transition: all 0.15s;
      user-select: none;
    }
    .stage-tab:hover {
      border-color: var(--primary);
      color: var(--primary);
    }
    .stage-tab--active {
      background: var(--primary);
      border-color: var(--primary);
      color: #fff;
    }
    .stage-tab__badge {
      display: inline-block;
      font-size: 10px;
      padding: 1px 5px;
      border-radius: 3px;
      margin-left: 4px;
      background: rgba(255,255,255,0.25);
    }
    .stage-tab--active .stage-tab__badge {
      background: rgba(255,255,255,0.3);
    }

    /* ── Mask overlay toggle ── */
    .mask-toggle-bar {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      padding: 8px 12px;
      background: var(--bg-subtle);
      border-radius: 6px;
      margin-bottom: var(--space-3);
      font-size: 13px;
    }
    .mask-toggle-bar label {
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* ── Stage label ── */
    .stage-label {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .stage-label__dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }
    .dot-red    { background: #ef4444; }
    .dot-blue   { background: #3b82f6; }
    .dot-purple { background: #8b5cf6; }
    .dot-green  { background: #22c55e; }
    .dot-gray   { background: #6b7280; }
    .dot-amber  { background: #f59e0b; }
  </style>
</head>
<body>

  <header class="app-header">
    <div class="container app-header__inner">
      <a class="app-brand" href="index.html">
        <span class="app-brand__mark">试</span>
        试卷宝
      </a>
      <nav class="app-nav">
        <a href="index.html">首页</a>
        <a href="mistakes.html">错题库</a>
        <a href="export.html">导出</a>
      </nav>
    </div>
  </header>

  <main class="container" x-data="paperPage()" x-init="init()" x-cloak>

    <!-- Header / breadcrumb -->
    <div class="flex items-center justify-between mt-2 mb-4 gap-3" style="flex-wrap: wrap">
      <div class="flex items-center gap-3">
        <a class="btn btn--ghost btn--sm" href="index.html">← 返回</a>
        <div>
          <h1 class="section-head__title" x-text="paper ? (paper.title || `${paper.child_id} · ${paper.subject}`) : '加载中…'"></h1>
          <div class="paper-meta" x-show="paper">
            <span x-text="paper && paper.child_id"></span>
            <span>·</span>
            <span x-text="paper && paper.subject"></span>
            <span>·</span>
            <span x-text="paper && (paper.paper_type || '其他')"></span>
            <span>·</span>
            <span x-text="paper && App.formatDate(paper.upload_time || paper.created_at)"></span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span x-show="paper" :class="paper && App.statusBadgeClass(paper.status)" x-text="paper && App.statusLabel(paper.status)"></span>
        <button class="btn btn--secondary btn--sm"
                :disabled="processing"
                @click="reprocess()">
          <span x-show="!processing">重新处理</span>
          <span x-show="processing" class="flex items-center gap-1"><span class="spinner"></span> 处理中</span>
        </button>
      </div>
    </div>

    <!-- ── Stage tabs ── -->
    <div class="stage-tabs" role="tablist" aria-label="切换处理阶段">
      <button class="stage-tab" :class="{ 'stage-tab--active': activeStage === 'original' }"
              @click="switchStage('original')">原图</button>
      <button class="stage-tab" :class="{ 'stage-tab--active': activeStage === 'preprocessed' }"
              @click="switchStage('preprocessed')" x-show="stageUrls.preprocessed">
        <span class="stage-label">
          <span class="stage-label__dot dot-amber"></span>预处理
        </span>
      </button>
      <button class="stage-tab" :class="{ 'stage-tab--active': activeStage === 'red_mask' }"
              @click="switchStage('red_mask')" x-show="stageUrls.red_mask">
        <span class="stage-label">
          <span class="stage-label__dot dot-red"></span>红笔 mask
        </span>
      </button>
      <button class="stage-tab" :class="{ 'stage-tab--active': activeStage === 'hw_mask' }"
              @click="switchStage('hw_mask')" x-show="stageUrls.hw_mask">
        <span class="stage-label">
          <span class="stage-label__dot dot-blue"></span>手写 mask
        </span>
      </button>
      <button class="stage-tab" :class="{ 'stage-tab--active': activeStage === 'combined_mask' }"
              @click="switchStage('combined_mask')" x-show="stageUrls.combined_mask">
        <span class="stage-label">
          <span class="stage-label__dot dot-purple"></span>合并 mask
        </span>
      </button>
      <button class="stage-tab" :class="{ 'stage-tab--active': activeStage === 'cleaned' }"
              @click="switchStage('cleaned')">
        <span class="stage-label">
          <span class="stage-label__dot dot-green"></span>清理图
        </span>
        <span class="stage-tab__badge" x-show="boxes.length" x-text="boxes.length"></span>
      </button>
    </div>

    <!-- ── Mask overlay toggle (only visible on mask stages) ── -->
    <div class="mask-toggle-bar" x-show="isMaskStage()">
      <label>
        <input type="checkbox" x-model="maskOverlay" @change="onMaskOverlayChange()" />
        叠加到预处理图上查看
      </label>
      <span class="text-faint text-sm">
        (选中时 mask 白色区域以红色半透明叠在原图上)
      </span>
    </div>

    <!-- ── Single image viewer ── -->
    <section class="compare-grid" style="margin-top: var(--space-3)">
      <div class="image-pane" style="grid-column: 1 / -1">
        <div class="image-pane__label">
          <span x-text="stageLabel()"></span>
          <span class="text-faint text-sm" x-show="activeStage === 'cleaned' && boxes.length" x-text="`${boxes.length} 个框`"></span>
        </div>
        <div class="image-pane__viewport" x-ref="viewport" style="position: relative">
          <!-- Mask overlay base (preprocessed) -->
          <img x-show="maskOverlay && isMaskStage()"
               :src="stageUrls.preprocessed"
               alt="预处理底图"
               style="position: absolute; top: 0; left: 0; width: 100%; height: auto; z-index: 1" />
          <!-- Mask overlay on top -->
          <canvas x-ref="maskOverlayCanvas"
                  x-show="maskOverlay && isMaskStage()"
                  style="position: absolute; top: 0; left: 0; width: 100%; height: auto; z-index: 2; pointer-events: none"
                  aria-label="mask 叠加层"></canvas>

          <!-- Normal stage image -->
          <img :src="currentStageUrl()"
               :alt="stageLabel()"
               @load="onStageImageLoad($event)"
               x-show="!maskOverlay || !isMaskStage()" />

          <!-- Canvas for box drawing (only on cleaned stage) -->
          <canvas x-ref="canvas"
                  x-show="activeStage === 'cleaned'"
                  aria-label="错题框选区域"
                  style="position: absolute; top: 0; left: 0"></canvas>

          <div class="empty-state" x-show="!currentStageUrl()">
            <div class="empty-state__icon">🖼️</div>
            <div class="text-faint">图片暂未生成</div>
            <button class="btn btn--secondary btn--sm" @click="reprocess()">立即处理</button>
          </div>
        </div>
      </div>
    </section>

    <!-- Mobile tab switcher (kept for backward compat) -->
    <div class="image-tabs show-mobile" role="tablist" aria-label="切换图片" x-show="false">
      <button role="tab" @click="switchStage('cleaned')">擦除图（可框选）</button>
      <button role="tab" @click="switchStage('original')">原图</button>
    </div>

    <!-- ── Box list / metadata editor ── -->
    <section style="margin-top: var(--space-5)" x-show="activeStage === 'cleaned'">
      <div class="section-head">
        <h2 class="section-head__title">错题框选 (<span x-text="boxes.length"></span>)</h2>
        <div class="flex gap-2">
          <button class="btn btn--ghost btn--sm" @click="clearAllBoxes()" :disabled="!boxes.length || saving">清空</button>
          <button class="btn btn--primary"
                  :disabled="!boxes.length || saving"
                  @click="saveAll()">
            <span x-show="!saving">保存所有错题</span>
            <span x-show="saving" class="flex items-center gap-2"><span class="spinner"></span> 保存中…</span>
          </button>
        </div>
      </div>

      <template x-if="boxes.length === 0">
        <div class="empty-state" style="padding: var(--space-8) var(--space-4)">
          <div class="empty-state__icon">✏️</div>
          <div class="empty-state__title">还没有框选错题</div>
          <div>在清理图上拖拽鼠标或手指，即可圈出错题区域。</div>
        </div>
      </template>

      <div class="box-list" x-show="boxes.length > 0">
        <template x-for="(b, i) in boxes" :key="b.id">
          <div class="box-item" :class="{ 'box-item--selected': b.id === selectedBoxId }"
               @click="selectBox(b.id)">
            <div class="box-item__color" :style="`background:${b.color}`"></div>
            <div class="box-item__body">
              <div class="box-item__title">
                第 <span x-text="i + 1"></span> 题
                <span class="box-item__coords" x-text="`(${b.x}, ${b.y}) · ${b.width}×${b.height}px`"></span>
              </div>
              <div class="form-row form-row--2">
                <div class="field">
                  <label class="field__label">错因类型</label>
                  <select class="select" :value="b.errorType" @change="updateBoxField(b.id, 'errorType', $event.target.value)">
                    <option value="">未分类</option>
                    <template x-for="t in errorTypes" :key="t">
                      <option :value="t" x-text="t"></option>
                    </template>
                  </select>
                </div>
                <div class="field">
                  <label class="field__label">备注</label>
                  <input class="input" type="text" maxlength="120"
                         placeholder="例如:漏了进位"
                         :value="b.note"
                         @input="updateBoxField(b.id, 'note', $event.target.value)" />
                </div>
              </div>
            </div>
            <div class="box-item__actions">
              <button class="btn btn--ghost btn--sm" title="删除"
                      @click.stop="removeBox(b)">✕</button>
            </div>
          </div>
        </template>
      </div>
    </section>

  </main>

  <script>
    function paperPage() {
      return {
        paperId: null,
        paper: null,
        // ── V2 multi-stage ──
        activeStage: 'cleaned',
        stageUrls: {
          original: '',
          preprocessed: '',
          red_mask: '',
          hw_mask: '',
          combined_mask: '',
          cleaned: '',
        },
        maskOverlay: false,

        cropper: null,
        boxes: [],
        selectedBoxId: null,
        existingMistakes: [],

        saving: false,
        processing: false,

        errorTypes: window.CROP_ERROR_TYPES || ['粗心', '概念不清', '计算错误', '不会做', '其他'],

        async init() {
          const q = App.parseQuery();
          this.paperId = q.id;
          if (!this.paperId) {
            App.toast('缺少试卷 ID', 'error');
            return;
          }

          try {
            const p = await ExamApi.getPaper(this.paperId);
            this.paper = p;
            // Build all stage URLs
            this.stageUrls.original = p.original_url || '';
            this.stageUrls.preprocessed = p.processed_url || App.staticUrl(p.processed_path);
            this.stageUrls.red_mask = p.red_mask_url || '';
            this.stageUrls.hw_mask = p.handwriting_mask_url || '';
            this.stageUrls.combined_mask = p.combined_mask_url || '';
            this.stageUrls.cleaned = p.cleaned_url || App.staticUrl(p.cleaned_path || p.processed_path);

            // Auto-switch to highest available stage
            if (this.stageUrls.cleaned) this.activeStage = 'cleaned';
            else if (this.stageUrls.combined_mask) this.activeStage = 'combined_mask';
            else if (this.stageUrls.preprocessed) this.activeStage = 'preprocessed';
            else this.activeStage = 'original';
          } catch (e) {
            App.toast(e.message || '试卷加载失败', 'error');
            return;
          }

          // Existing mistakes
          try {
            const r = await ExamApi.listMistakes({ paper_id: this.paperId, limit: 100 });
            this.existingMistakes = (r && r.mistakes) || [];
          } catch (e) { /* non-fatal */ }
        },

        // ── Stage switching ──
        switchStage(stage) {
          this.activeStage = stage;
          this.maskOverlay = false; // reset overlay on switch
          // If switching to cleaned or original, ensure cropper is initialized
          if (stage === 'cleaned') {
            this.$nextTick(() => this.initCropperIfNeeded());
          }
        },

        isMaskStage() {
          return ['red_mask', 'hw_mask', 'combined_mask'].includes(this.activeStage);
        },

        stageLabel() {
          const labels = {
            original: '原图',
            preprocessed: '预处理（纠偏·去阴影·裁边）',
            red_mask: '红笔识别 mask',
            hw_mask: '手写识别 mask',
            combined_mask: '合并 mask（红笔+手写）',
            cleaned: '清理图（在此框选错题）',
          };
          return labels[this.activeStage] || '';
        },

        currentStageUrl() {
          return this.stageUrls[this.activeStage] || '';
        },

        // ── Mask overlay ──
        onMaskOverlayChange() {
          if (!this.maskOverlay || !this.isMaskStage()) return;
          this.$nextTick(() => this.renderMaskOverlay());
        },

        async renderMaskOverlay() {
          const img = new Image();
          const maskUrl = this.stageUrls[this.activeStage];
          const baseUrl = this.stageUrls.preprocessed;
          if (!maskUrl || !baseUrl) return;

          // Load the mask image and draw it as a red overlay
          img.onload = () => {
            const canvas = this.$refs.maskOverlayCanvas;
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            // Match the preprocessed image display size
            const viewport = this.$refs.viewport;
            const preprocessedImg = viewport ? viewport.querySelector('img[src]') : null;
            const displayW = preprocessedImg ? preprocessedImg.clientWidth : img.naturalWidth;
            const displayH = preprocessedImg ? preprocessedImg.clientHeight : img.naturalHeight;
            canvas.width = displayW;
            canvas.height = displayH;

            // Draw mask: white pixels → red semi-transparent overlay
            const offCanvas = document.createElement('canvas');
            offCanvas.width = displayW;
            offCanvas.height = displayH;
            const offCtx = offCanvas.getContext('2d');
            offCtx.drawImage(img, 0, 0, displayW, displayH);
            const imageData = offCtx.getImageData(0, 0, displayW, displayH);
            const data = imageData.data;
            for (let i = 0; i < data.length; i += 4) {
              const gray = data[i]; // R channel ≈ gray level
              if (gray > 127) {
                // White mask pixel → red overlay
                data[i] = 255;     // R
                data[i + 1] = 0;   // G
                data[i + 2] = 0;   // B
                data[i + 3] = 120; // Alpha
              } else {
                data[i + 3] = 0;   // Transparent
              }
            }
            offCtx.putImageData(imageData, 0, 0);
            ctx.clearRect(0, 0, displayW, displayH);
            ctx.drawImage(offCanvas, 0, 0);
          };
          img.crossOrigin = 'anonymous';
          img.src = maskUrl + (maskUrl.includes('?') ? '&' : '?') + '_=' + Date.now();
        },

        // ── Image handling ──
        onStageImageLoad(ev) {
          if (this.activeStage === 'cleaned') {
            this.initCropper(ev.target);
          }
          if (this.maskOverlay && this.isMaskStage()) {
            this.renderMaskOverlay();
          }
        },

        initCropperIfNeeded() {
          const imgEl = this.$refs.viewport
            ? this.$refs.viewport.querySelector('img[src]:not([style*="absolute"])')
            : null;
          if (imgEl && imgEl.complete) {
            this.initCropper(imgEl);
          }
        },

        initCropper(img) {
          const canvas = this.$refs.canvas;
          if (!img || !canvas) return;

          requestAnimationFrame(() => {
            if (this.cropper) this.cropper.destroy();
            this.cropper = createCropper({
              canvas,
              image: img,
              onChange: (boxes) => { this.boxes = boxes; },
              onSelect: (id) => { this.selectedBoxId = id; },
            });
            // Hydrate from server
            const initial = (this.existingMistakes || []).map((m) => ({
              id: m.id,
              x: m.crop_x, y: m.crop_y,
              w: m.crop_width, h: m.crop_height,
              note: m.note || '',
              errorType: m.error_type || '',
            }));
            if (initial.length) this.cropper.setBoxes(initial);
          });
        },

        selectBox(id) {
          if (this.cropper) this.cropper.selectBox(id);
        },

        updateBoxField(id, key, value) {
          if (!this.cropper) return;
          const partial = {};
          partial[key] = value;
          this.cropper.updateBox(id, partial);
        },

        removeBox(b) {
          if (!this.cropper) return;
          const isBackend = typeof b.id === 'number' || /^\d+$/.test(String(b.id));
          if (isBackend) {
            ExamApi.deleteMistake(b.id)
              .then(() => App.toast('已删除', 'success'))
              .catch((e) => App.toast(e.message || '删除失败', 'error'));
          }
          this.cropper.deleteBox(b.id);
        },

        clearAllBoxes() {
          if (!this.cropper) return;
          for (const b of this.boxes) {
            if (typeof b.id === 'number' || /^\d+$/.test(String(b.id))) {
              ExamApi.deleteMistake(b.id).catch(() => {});
            }
          }
          this.cropper.clearAll();
          App.toast('已清空所有框选', 'info');
        },

        async saveAll() {
          if (!this.boxes.length) return;
          this.saving = true;
          let okCount = 0, failCount = 0;
          try {
            for (const b of [...this.boxes]) {
              const isNew = String(b.id).startsWith('tmp-');
              try {
                if (isNew) {
                  const r = await ExamApi.createMistake(
                    this.paperId,
                    { x: b.x, y: b.y, width: b.width, height: b.height },
                    b.note || '',
                    b.errorType || ''
                  );
                  if (r && r.mistake_id !== undefined) {
                    this.cropper.updateBox(b.id, { id: r.mistake_id });
                  }
                  okCount++;
                } else if (b.dirty) {
                  await ExamApi.updateMistake(b.id, {
                    note: b.note || '',
                    error_type: b.errorType || '',
                  });
                  okCount++;
                }
              } catch (e) {
                failCount++;
                App.toast(`第 ${b.index} 题保存失败:${e.message}`, 'error');
              }
            }
            if (failCount === 0) App.toast(`已保存 ${okCount} 个错题`, 'success');
            else App.toast(`保存完成,${okCount} 成功 / ${failCount} 失败`, 'error');
          } finally {
            this.saving = false;
          }
        },

        async reprocess() {
          if (this.processing) return;
          this.processing = true;
          try {
            await ExamApi.processPaper(this.paperId);
            App.toast('处理完成', 'success');
            // Reload
            const p = await ExamApi.getPaper(this.paperId);
            this.paper = p;
            this.stageUrls.original = p.original_url || '';
            this.stageUrls.preprocessed = p.processed_url || App.staticUrl(p.processed_path);
            this.stageUrls.red_mask = p.red_mask_url || '';
            this.stageUrls.hw_mask = p.handwriting_mask_url || '';
            this.stageUrls.combined_mask = p.combined_mask_url || '';
            this.stageUrls.cleaned = p.cleaned_url || App.staticUrl(p.cleaned_path || p.processed_path);
            this.activeStage = 'cleaned';
          } catch (e) {
            App.toast(e.message || '处理失败', 'error');
          } finally {
            this.processing = false;
          }
        },
      };
    }
  </script>

</body>
</html>
