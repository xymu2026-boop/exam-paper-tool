<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#3B82F6" />
  <title>试卷宝 · 试卷详情</title>
  <link rel="stylesheet" href="static/style.css" />

  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.13.7/dist/cdn.min.js"></script>
  <!-- <script defer src="static/vendor/alpinejs@3.min.js"></script> -->

  <script src="static/api.js"></script>
  <script src="static/app.js"></script>
  <script src="static/crop.js"></script>
</head>
<body>

  <header class="app-header">
    <div class="container app-header__inner">
      <a class="app-brand" href="index.html">
        <span class="app-brand__mark">试</span>
        试卷宝
      </a>
      <nav class="app-nav">
        <a href="index.html">首页</a>
        <a href="mistakes.html">错题库</a>
        <a href="export.html">导出</a>
      </nav>
    </div>
  </header>

  <main class="container" x-data="paperPage()" x-init="init()" x-cloak>

    <!-- Header / breadcrumb -->
    <div class="flex items-center justify-between mt-2 mb-4 gap-3" style="flex-wrap: wrap">
      <div class="flex items-center gap-3">
        <a class="btn btn--ghost btn--sm" href="index.html">← 返回</a>
        <div>
          <h1 class="section-head__title" x-text="paper ? (paper.title || `${paper.child_id} · ${paper.subject}`) : '加载中…'"></h1>
          <div class="paper-meta" x-show="paper">
            <span x-text="paper && paper.child_id"></span>
            <span>·</span>
            <span x-text="paper && paper.subject"></span>
            <span>·</span>
            <span x-text="paper && (paper.paper_type || '其他')"></span>
            <span>·</span>
            <span x-text="paper && App.formatDate(paper.upload_time || paper.created_at)"></span>
          </div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <span x-show="paper" :class="paper && App.statusBadgeClass(paper.status)" x-text="paper && App.statusLabel(paper.status)"></span>
        <button class="btn btn--secondary btn--sm" x-show="paper && paper.status !== 'processed'"
                :disabled="processing"
                @click="reprocess()">
          <span x-show="!processing">重新处理</span>
          <span x-show="processing" class="flex items-center gap-1"><span class="spinner"></span> 处理中</span>
        </button>
      </div>
    </div>

    <!-- Multi-stage tab switcher -->
    <div class="image-tabs" role="tablist" aria-label="切换查看阶段">
      <template x-for="tab in tabs" :key="tab.key">
        <button role="tab"
                :class="{ 'tab--active': activeTab === tab.key }"
                :aria-pressed="activeTab === tab.key"
                @click="switchTab(tab.key)"
                x-text="tab.label"></button>
      </template>
    </div>

    <!-- Stage image viewer -->
    <section style="margin-top: var(--space-3)">
      <template x-for="tab in tabs" :key="tab.key">
        <div class="image-pane" x-show="activeTab === tab.key">
          <div class="image-pane__label">
            <span x-text="tab.label"></span>
            <span class="text-faint text-sm" x-text="tab.desc"></span>
          </div>
          <div class="image-pane__viewport" x-ref="viewport">
            <!-- 最终清理图: 叠加 Canvas 框选 -->
            <template x-if="tab.key === 'cleaned'">
              <div>
                <img x-ref="cleanedImg"
                     x-show="cleanedUrl"
                     :src="cleanedUrl"
                     alt="擦除图"
                     crossorigin="anonymous"
                     @load="onCleanedLoad($event)" />
                <canvas x-ref="canvas"
                        x-show="cleanedUrl"
                        aria-label="错题框选区域"></canvas>
              </div>
            </template>
            <!-- 其他阶段: 纯展示 -->
            <template x-if="tab.key !== 'cleaned'">
              <img x-show="tab.url" :src="tab.url" :alt="tab.label" />
            </template>
            <div class="empty-state" x-show="!tab.url">
              <div class="empty-state__icon">⏳</div>
              <div class="text-faint" x-text="tab.emptyText || '暂无图片'"></div>
            </div>
          </div>
        </div>
      </template>
    </section>

    <!-- Box list / metadata editor -->
    <section style="margin-top: var(--space-5)">
      <div class="section-head">
        <h2 class="section-head__title">错题框选 (<span x-text="boxes.length"></span>)</h2>
        <div class="flex gap-2">
          <button class="btn btn--ghost btn--sm" @click="clearAllBoxes()" :disabled="!boxes.length || saving">清空</button>
          <button class="btn btn--primary"
                  :disabled="!boxes.length || saving"
                  @click="saveAll()">
            <span x-show="!saving">保存所有错题</span>
            <span x-show="saving" class="flex items-center gap-2"><span class="spinner"></span> 保存中…</span>
          </button>
        </div>
      </div>

      <template x-if="boxes.length === 0">
        <div class="empty-state" style="padding: var(--space-8) var(--space-4)">
          <div class="empty-state__icon">✏️</div>
          <div class="empty-state__title">还没有框选错题</div>
          <div>在左侧/上方擦除图上拖拽鼠标或手指,即可圈出错题区域。</div>
        </div>
      </template>

      <div class="box-list" x-show="boxes.length > 0">
        <template x-for="(b, i) in boxes" :key="b.id">
          <div class="box-item" :class="{ 'box-item--selected': b.id === selectedBoxId }"
               @click="selectBox(b.id)">
            <div class="box-item__color" :style="`background:${b.color}`"></div>
            <div class="box-item__body">
              <div class="box-item__title">
                第 <span x-text="i + 1"></span> 题
                <span class="box-item__coords" x-text="`(${b.x}, ${b.y}) · ${b.width}×${b.height}px`"></span>
              </div>
              <div class="form-row form-row--2">
                <div class="field">
                  <label class="field__label">错因类型</label>
                  <select class="select" :value="b.errorType" @change="updateBoxField(b.id, 'errorType', $event.target.value)">
                    <option value="">未分类</option>
                    <template x-for="t in errorTypes" :key="t">
                      <option :value="t" x-text="t"></option>
                    </template>
                  </select>
                </div>
                <div class="field">
                  <label class="field__label">备注</label>
                  <input class="input" type="text" maxlength="120"
                         placeholder="例如:漏了进位"
                         :value="b.note"
                         @input="updateBoxField(b.id, 'note', $event.target.value)" />
                </div>
              </div>
            </div>
            <div class="box-item__actions">
              <button class="btn btn--ghost btn--sm" title="删除"
                      @click.stop="removeBox(b)">✕</button>
            </div>
          </div>
        </template>
      </div>
    </section>

  </main>

  <script>
    function paperPage() {
      return {
        paperId: null,
        paper: null,
        originalUrl: '',
        cleanedUrl: '',
        processedUrl: '',
        redMaskUrl: '',
        hwMaskUrl: '',
        combinedMaskUrl: '',
        activeTab: 'cleaned',

        tabs: [
          { key: 'original',  label: '① 原图',     desc: '上传的原始试卷照片', emptyText: '还没有原图' },
          { key: 'processed',  label: '② 预处理',   desc: '轻量处理: 旋转/裁边/去阴影', emptyText: '预处理图未生成' },
          { key: 'hw_mask',    label: '③ 手写Mask', desc: '白色=识别的手写笔迹(铅笔/黑笔)', emptyText: 'Mask未生成' },
          { key: 'red_mask',   label: '④ 红笔Mask', desc: '白色=识别的红色批改/圈画', emptyText: 'Mask未生成' },
          { key: 'cleaned',    label: '⑤ 最终清理', desc: '擦除手写+红笔后的干净试卷(可框选错题)', emptyText: '擦除图正在生成…' },
        ],

        cropper: null,
        boxes: [],
        selectedBoxId: null,
        existingMistakes: [],

        saving: false,
        processing: false,

        errorTypes: window.CROP_ERROR_TYPES || ['粗心', '概念不清', '计算错误', '不会做', '其他'],

        async init() {
          const q = App.parseQuery();
          this.paperId = q.id;
          if (!this.paperId) {
            App.toast('缺少试卷 ID', 'error');
            return;
          }

          try {
            const p = await ExamApi.getPaper(this.paperId);
            this.paper = p;

            const base = p.original_path ? p.original_path.replace(/original\.jpg$/, '') : '';
            const staticBase = App.staticUrl || ((path) => '/static/data/' + path);

            this.originalUrl  = p.original_url  || staticBase(p.original_path);
            this.cleanedUrl   = p.cleaned_url   || staticBase(p.cleaned_path || p.processed_path);
            this.processedUrl = p.processed_url || (base ? staticBase(base + 'processed.jpg') : '');
            this.redMaskUrl   = p.red_mask_url  || (base ? staticBase(base + 'red_mask.jpg') : '');
            this.hwMaskUrl    = p.hw_mask_url   || (base ? staticBase(base + 'handwriting_mask.jpg') : '');
            this.combinedMaskUrl = (base ? staticBase(base + 'combined_mask.jpg') : '');

            this.updateTabUrls();
          } catch (e) {
            App.toast(e.message || '试卷加载失败', 'error');
            return;
          }

          try {
            const r = await ExamApi.listMistakes({ paper_id: this.paperId, limit: 100 });
            this.existingMistakes = (r && r.mistakes) || [];
          } catch (e) { /* non-fatal */ }
        },

        updateTabUrls() {
          const map = {
            original: this.originalUrl,
            processed: this.processedUrl,
            hw_mask: this.hwMaskUrl,
            red_mask: this.redMaskUrl,
            cleaned: this.cleanedUrl,
          };
          this.tabs = this.tabs.map(t => ({ ...t, url: map[t.key] || '' }));
        },

        switchTab(key) {
          this.activeTab = key;
          if (key === 'cleaned' && this.cleanedUrl && !this.cropper) {
            this.$nextTick(() => {
              const img = this.$refs.cleanedImg;
              if (img) this.onCleanedLoad({ target: img });
            });
          }
        },

        onCleanedLoad(ev) {
          const img = ev.target;
          const canvas = this.$refs.canvas;
          if (!img || !canvas) return;
          requestAnimationFrame(() => {
            if (this.cropper) this.cropper.destroy();
            this.cropper = createCropper({
              canvas,
              image: img,
              onChange: (boxes) => { this.boxes = boxes; },
              onSelect: (id) => { this.selectedBoxId = id; },
            });
            const initial = (this.existingMistakes || []).map((m) => ({
              id: m.id,
              x: m.crop_x, y: m.crop_y,
              w: m.crop_width, h: m.crop_height,
              note: m.note || '',
              errorType: m.error_type || '',
            }));
            if (initial.length) this.cropper.setBoxes(initial);
          });
        },

        selectBox(id) { if (this.cropper) this.cropper.selectBox(id); },

        updateBoxField(id, key, value) {
          if (!this.cropper) return;
          this.cropper.updateBox(id, { [key]: value });
        },

        removeBox(b) {
          if (!this.cropper) return;
          const isBackend = typeof b.id === 'number' || /^\d+$/.test(String(b.id));
          if (isBackend) {
            ExamApi.deleteMistake(b.id)
              .then(() => App.toast('已删除', 'success'))
              .catch((e) => App.toast(e.message || '删除失败', 'error'));
          }
          this.cropper.deleteBox(b.id);
        },

        clearAllBoxes() {
          if (!this.cropper) return;
          for (const b of this.boxes) {
            if (typeof b.id === 'number' || /^\d+$/.test(String(b.id))) {
              ExamApi.deleteMistake(b.id).catch(() => {});
            }
          }
          this.cropper.clearAll();
          App.toast('已清空所有框选', 'info');
        },

        async saveAll() {
          if (!this.boxes.length) return;
          this.saving = true;
          let okCount = 0, failCount = 0;
          try {
            for (const b of [...this.boxes]) {
              const isNew = String(b.id).startsWith('tmp-');
              try {
                if (isNew) {
                  const r = await ExamApi.createMistake(
                    this.paperId,
                    { x: b.x, y: b.y, width: b.width, height: b.height },
                    b.note || '',
                    b.errorType || ''
                  );
                  if (r && r.mistake_id !== undefined) {
                    this.cropper.updateBox(b.id, { id: r.mistake_id });
                  }
                  okCount++;
                } else if (b.dirty) {
                  await ExamApi.updateMistake(b.id, {
                    note: b.note || '',
                    error_type: b.errorType || '',
                  });
                  okCount++;
                }
              } catch (e) {
                failCount++;
                App.toast(`第 ${b.index} 题保存失败:${e.message}`, 'error');
              }
            }
            if (failCount === 0) App.toast(`已保存 ${okCount} 个错题`, 'success');
            else App.toast(`保存完成,${okCount} 成功 / ${failCount} 失败`, 'error');
          } finally { this.saving = false; }
        },

        async reprocess() {
          if (this.processing) return;
          this.processing = true;
          try {
            await ExamApi.processPaper(this.paperId);
            App.toast('处理完成', 'success');
            const p = await ExamApi.getPaper(this.paperId);
            this.paper = p;
            const base = p.original_path ? p.original_path.replace(/original\.jpg$/, '') : '';
            const staticBase = App.staticUrl || ((path) => '/static/data/' + path);
            this.originalUrl  = p.original_url  || staticBase(p.original_path);
            this.cleanedUrl   = p.cleaned_url   || staticBase(p.cleaned_path);
            this.processedUrl = p.processed_url || (base ? staticBase(base + 'processed.jpg') : '');
            this.redMaskUrl   = p.red_mask_url  || (base ? staticBase(base + 'red_mask.jpg') : '');
            this.hwMaskUrl    = p.hw_mask_url   || (base ? staticBase(base + 'handwriting_mask.jpg') : '');
            this.updateTabUrls();
          } catch (e) {
            App.toast(e.message || '处理失败', 'error');
          } finally { this.processing = false; }
        },
      };
    }
  </script>

</body>
</html>
